name: ConduitApp
options:
  bundleIdPrefix: com.kellyredding
  deploymentTarget:
    macOS: "14.0"

targets:
  ConduitApp:
    type: application
    platform: macOS
    sources:
      - ConduitApp
    info:
      path: ConduitApp/Info.plist
      properties:
        CFBundleName: Conduit
        CFBundleDisplayName: Conduit
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        # NB: deliberately NOT LSUIElement. That key declares a background
        # agent, and application launchers, the Dock, and the ⌘-Tab switcher
        # all skip those by design — which makes the app impossible to find
        # the first time, and after a rebuild.
        #
        # AppDelegate sets .accessory at launch instead. Launch Services
        # indexes an ordinary application and every launcher lists it, while
        # the running process still has no Dock icon and no switcher entry.
    settings:
      base:
        PRODUCT_NAME: Conduit
        EXECUTABLE_NAME: Conduit
        PRODUCT_BUNDLE_IDENTIFIER: com.kellyredding.Conduit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        # Deliberately NOT sandboxed. The app executes a binary in
        # /Applications and reads system routing state; the sandbox forecloses
        # both, and there is no entitlement that restores them.
        ENABLE_APP_SANDBOX: NO

  # Sandboxed smoke check: no app launch, no AppKit, no window server. It
  # compiles the model layer and exercises it directly, which is only possible
  # because that layer depends on Foundation and nothing else — including the
  # subprocess runner, so the HOME override and the error-envelope handling are
  # covered against a fixture rather than asserted in a comment.
  #
  # The seam is load-bearing: anything added under Models must stay
  # Foundation-only. Polling schedules, menu state, and views depend on AppKit
  # and SwiftUI, so they live outside Models and this target neither compiles
  # them nor needs to.
  VPNSmoke:
    type: tool
    platform: macOS
    sources:
      - ConduitApp/Models
      - VPNSmoke
    settings:
      base:
        SWIFT_VERSION: "5.10"
